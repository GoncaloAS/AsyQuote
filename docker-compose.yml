# Local development stack. Requires a .env file:
#   cp .env.example .env
# Then:
#   docker compose up --build
# The django service runs migrations and loads fixtures/demo_data.json into an
# empty database before starting the dev server on http://localhost:8000.

services:
  # Local mail catcher: the app really sends, nothing leaves the machine, and
  # every message is readable at http://localhost:8025 (SMTP on 1025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asyquote}
      POSTGRES_USER: ${POSTGRES_USER:-asyquote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asyquote}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-asyquote} -d ${POSTGRES_DB:-asyquote}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      # Source is mounted so runserver's autoreload picks up edits. This also
      # exposes the demo media the fixture's Wagtail image rows point at.
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      DATABASE_URL: ${DATABASE_URL:-postgres://asyquote:asyquote@postgres:5432/asyquote}
      # Unset in .env, so mail goes to the mailpit container. Set EMAIL_HOST to
      # a real SMTP server and it is honoured here too.
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
    ports:
      - '8000:8000'
    command: /start

volumes:
  postgres_data:
